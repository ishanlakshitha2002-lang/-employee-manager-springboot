<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Employee - Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1>Employee Management System</h1>
    <p>Edit employee details</p>
</header>

<main class="container narrow">

    <section class="card">
        <h2>Edit Employee #<span th:text="${employee.id}"></span></h2>

        <form th:action="@{/employees/{id}/update(id=${employee.id})}"
              th:object="${employee}" method="post" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" class="form-control"
                       th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" class="form-control"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="text" id="phone" class="form-control"
                       th:field="*{phone}"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label for="department">Department:</label>
                <input type="text" id="department" class="form-control"
                       th:field="*{department}"
                       th:classappend="${#fields.hasErrors('department')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
            </div>

            <div class="form-group">
                <label for="salary">Salary:</label>
                <input type="number" step="0.01" id="salary" class="form-control"
                       th:field="*{salary}"
                       th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn primary">Update Employee</button>
                <a th:href="@{/employees}" class="btn secondary">Back to list</a>
            </div>
        </form>
    </section>

</main>

<footer class="footer">
    COSC 32133 / BECS 32263 &middot; Lab Sheet 05
</footer>

</body>
</html>
