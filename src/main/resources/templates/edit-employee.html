<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Employee</title>
</head>
<body>

<h1>Edit Employee</h1>

<form th:action="@{/employees/{id}/update(id=${employee.id})}"
      th:object="${employee}" method="post">

    <label>Full Name:</label>
    <input type="text" th:field="*{fullName}">
    <span th:errors="*{fullName}"></span>
    <br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}">
    <span th:errors="*{email}"></span>
    <br><br>

    <label>Phone:</label>
    <input type="text" th:field="*{phone}">
    <span th:errors="*{phone}"></span>
    <br><br>

    <label>Department:</label>
    <input type="text" th:field="*{department}">
    <span th:errors="*{department}"></span>
    <br><br>

    <label>Salary:</label>
    <input type="number" step="0.01" th:field="*{salary}">
    <span th:errors="*{salary}"></span>
    <br><br>

    <button type="submit">Update Employee</button>
</form>

<a th:href="@{/employees}">Back to list</a>

</body>
</html>
