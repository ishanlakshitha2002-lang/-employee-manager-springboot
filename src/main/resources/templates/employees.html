<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management</title>
</head>
<body>

<h1>Employee Management System</h1>

<h2>Add Employee</h2>

<form th:action="@{/employees}"
      th:object="${employee}" method="post">

    <label>Full Name:</label>
    <input type="text" th:field="*{fullName}">
    <span th:errors="*{fullName}"></span>
    <br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}">
    <span th:errors="*{email}"></span>
    <br><br>

    <label>Phone:</label>
    <input type="text" th:field="*{phone}">
    <span th:errors="*{phone}"></span>
    <br><br>

    <label>Department:</label>
    <input type="text" th:field="*{department}">
    <span th:errors="*{department}"></span>
    <br><br>

    <label>Salary:</label>
    <input type="number" step="0.01" th:field="*{salary}">
    <span th:errors="*{salary}"></span>
    <br><br>

    <button type="submit">Save Employee</button>
</form>

<hr>

<h2>Employee List</h2>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.fullName}"></td>
        <td th:text="${emp.email}"></td>
        <td th:text="${emp.phone}"></td>
        <td th:text="${emp.department}"></td>
        <td th:text="${emp.salary}"></td>

        <td>
            <a th:href="@{/employees/{id}/edit(id=${emp.id})}">
                Edit
            </a>

            <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                  method="post" style="display:inline">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
