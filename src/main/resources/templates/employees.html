<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header class="topbar">
    <h1>Employee Management System</h1>
    <p>Spring Boot &middot; Thymeleaf &middot; MySQL</p>
</header>

<main class="container">

    <!-- Flash Messages (Alerts) -->
    <div class="alert success" th:if="${success}" th:text="${success}"></div>
    <div class="alert danger" th:if="${error}" th:text="${error}"></div>

    <!-- CREATE: Add Employee Form -->
    <section class="card">
        <h2>Add Employee</h2>
        <form th:action="@{/employees}" th:object="${employee}" method="post" novalidate>
            <div class="form-group">
                <label for="fullName">Full Name:</label>
                <input type="text" id="fullName" class="form-control"
                       th:field="*{fullName}"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" class="form-control"
                       th:field="*{email}"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label for="phone">Phone:</label>
                <input type="text" id="phone" class="form-control"
                       th:field="*{phone}"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <div class="form-group">
                <label for="department">Department:</label>
                <input type="text" id="department" class="form-control"
                       th:field="*{department}"
                       th:classappend="${#fields.hasErrors('department')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}"></span>
            </div>

            <div class="form-group">
                <label for="salary">Salary:</label>
                <input type="number" step="0.01" id="salary" class="form-control"
                       th:field="*{salary}"
                       th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('salary')}" th:errors="*{salary}"></span>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn primary">Save Employee</button>
            </div>
        </form>
    </section>

    <!-- READ: Employee List Table -->
    <section class="card">
        <h2>
            <span>Employee List</span>
            <span class="badge" th:text="${#lists.size(employees)}">0</span>
        </h2>

        <!-- Search Box (Task 11) -->
        <div class="search-container">
            <form th:action="@{/employees}" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}"
                       placeholder="Search by name..." class="form-control search-input">
                <button type="submit" class="btn primary small">Search</button>
                <a th:href="@{/employees}" class="btn secondary small"
                   th:if="${keyword != null and keyword != ''}">Clear</a>
            </form>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="7" class="empty"
                        th:text="${keyword != null and keyword != ''} ? 'No employees found matching \'' + ${keyword} + '\'' : 'No employees registered yet.'">
                        No employees registered yet.
                    </td>
                </tr>

                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}"></td>
                    <td th:text="${emp.fullName}"></td>
                    <td th:text="${emp.email}"></td>
                    <td th:text="${emp.phone}"></td>
                    <td th:text="${emp.department}"></td>
                    <td th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}"></td>
                    <td class="actions">
                        <!-- UPDATE -->
                        <a class="btn small secondary" th:href="@{/employees/{id}/edit(id=${emp.id})}">Edit</a>

                        <!-- DELETE with confirm dialog -->
                        <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                              method="post"
                              style="display:inline"
                              onsubmit="return confirm('Are you sure you want to delete this employee?');">
                            <button type="submit" class="btn small danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<footer class="footer">
    COSC 32133 / BECS 32263 &middot; Lab Sheet 05
</footer>

</body>
</html>
